<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2a170" />
      <stop offset="100%" stop-color="#c67d4e" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Head -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Code Matrix Accents -->
  <g opacity="0.12" fill="#38bdf8" font-family="monospace" font-size="12">
    <text x="25" y="50">def init_engineer():</text>
    <text x="25" y="70">    name = "Bharath Chelimalla"</text>
    <text x="25" y="90">    role = "Full-Stack &amp; AI"</text>
    <text x="25" y="110">    degree = "M.Tech CSE"</text>
    <text x="25" y="130">    status = "Active"</text>
    <text x="260" y="320">ROC_AUC = 0.962</text>
    <text x="260" y="340">LATENCY = "&lt;30ms"</text>
    <text x="260" y="360">STACK = "FastAPI"</text>
  </g>

  <!-- Body / Blazer Suit -->
  <path d="M70,480 C70,360 120,330 160,320 L240,320 C280,330 330,360 330,480 Z" fill="url(#suitGrad)" />
  
  <!-- Shirt Inner -->
  <path d="M165,320 L200,380 L235,320 Z" fill="#f8fafc" />
  
  <!-- Tie -->
  <path d="M194,340 L206,340 L209,420 L200,435 L191,420 Z" fill="#0284c7" />

  <!-- Neck -->
  <rect x="178" y="240" width="44" height="85" rx="10" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="190" rx="60" ry="75" fill="url(#skinGrad)" />

  <!-- Professional Hair Cut -->
  <path d="M136,180 C134,130 150,105 200,105 C250,105 266,130 264,180 C255,145 240,125 200,125 C160,125 145,145 136,180 Z" fill="#1e1b18" />
  <path d="M136,160 C136,120 160,100 200,100 C240,100 264,120 264,160 C264,130 240,115 200,115 C160,115 136,130 136,160 Z" fill="#0f0e0c" />

  <!-- Ears -->
  <ellipse cx="138" cy="190" rx="8" ry="14" fill="url(#skinGrad)" />
  <ellipse cx="262" cy="190" rx="8" ry="14" fill="url(#skinGrad)" />

  <!-- Eyes & Eyebrows -->
  <path d="M160,165 Q175,160 185,165" stroke="#1e1b18" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M215,165 Q225,160 240,165" stroke="#1e1b18" stroke-width="3.5" fill="none" stroke-linecap="round" />
  
  <ellipse cx="173" cy="178" rx="6" ry="6" fill="#1e1b18" />
  <ellipse cx="227" cy="178" rx="6" ry="6" fill="#1e1b18" />
  <circle cx="175" cy="176" r="2" fill="#ffffff" />
  <circle cx="229" cy="176" r="2" fill="#ffffff" />

  <!-- Smart Glasses Frame -->
  <rect x="156" y="167" width="34" height="22" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="210" y="167" width="34" height="22" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="190" y1="178" x2="210" y2="178" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Nose -->
  <path d="M198,185 L196,205 L204,205" stroke="#a7633c" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Warm Confident Smile -->
  <path d="M185,225 Q200,238 215,225" stroke="#874724" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Verified Engineer Badge Over Portrait -->
  <g transform="translate(25, 410)">
    <rect width="180" height="38" rx="19" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <circle cx="22" cy="19" r="7" fill="#10b981" />
    <circle cx="22" cy="19" r="11" fill="#10b981" opacity="0.3" />
    <text x="38" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">BHARATH CHELIMALLA</text>
  </g>
</svg>

